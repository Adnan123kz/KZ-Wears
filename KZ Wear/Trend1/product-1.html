<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dust Trousers — KZ’s Wear</title>
    <meta name="description" content="Dust Trousers. KZ’s Wear." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

    <!-- La tipografía está en la carpeta /fonts y se carga desde product-1.css -->
    <link rel="stylesheet" href="product-1.css" />
    <script src="product-1.js" defer></script>
  </head>

  <body>
    <main class="product">
      <!-- =====================================================
           IZQUIERDA · Foto con marco blanco + el ゴゴゴ animado
           · Cambiar la foto: sustituye images/product-1/photo.jpg
             (mismo nombre) o cambia el src de abajo.
           · IMPORTANTE: esa foto debe ir SIN el ゴゴゴ dibujado encima;
             las letras de abajo ya se encargan de eso.
           ===================================================== -->
      <section class="photo" aria-label="Product photo">
        <div class="frame">
          <img
            class="frame__img"
            src="images/product-1/photo.jpg"
            alt="Back view of the Dust Trousers: wide washed light-blue jeans with a purple and pink diamond stripe down the side and three round badges on the back pocket"
            width="725"
            height="903"
            fetchpriority="high"
          />

          <!-- El ゴゴゴ: 5 letras (cada una = el ゴ + sus dos rayitas) y 3 puntos.
               Cada pieza es un PNG suelto para poder animarla por separado.
               --x / --y / --w son su posición y su ancho (en % del bloque).
               El bloque entero se gira desde el CSS (variable --tilt). -->
          <div class="gogogo" aria-hidden="true">
            <div class="go" style="--i:0; --ox:20.66%; --oy:26.31%">
              <div class="go__inner">
                <img class="go__body" src="images/product-1/go-1.png" alt="" style="--x:0%; --y:20.89%; --w:26.65%" />
                <img class="go__tick" src="images/product-1/tick-1.png" alt="" style="--x:20.9%; --y:0%; --w:20.42%" />
              </div>
            </div>
            <div class="go" style="--i:1; --ox:40.65%; --oy:27.81%">
              <div class="go__inner">
                <img class="go__body" src="images/product-1/go-2.png" alt="" style="--x:22.74%; --y:22.32%; --w:27.51%" />
                <img class="go__tick" src="images/product-1/tick-2.png" alt="" style="--x:41.56%; --y:6.4%; --w:16.99%" />
              </div>
            </div>
            <div class="go" style="--i:2; --ox:47.31%; --oy:51.83%">
              <div class="go__inner">
                <img class="go__body" src="images/product-1/go-3.png" alt="" style="--x:27.87%; --y:43.86%; --w:31.66%" />
                <img class="go__tick" src="images/product-1/tick-3.png" alt="" style="--x:49.14%; --y:30.94%; --w:17.6%" />
              </div>
            </div>
            <div class="go" style="--i:3; --ox:71.52%; --oy:56.33%">
              <div class="go__inner">
                <img class="go__body" src="images/product-1/go-4.png" alt="" style="--x:55.01%; --y:48.3%; --w:24.69%" />
                <img class="go__tick" src="images/product-1/tick-4.png" alt="" style="--x:71.88%; --y:39.03%; --w:16.14%" />
              </div>
            </div>
            <div class="go" style="--i:4; --ox:79.58%; --oy:74.28%">
              <div class="go__inner">
                <img class="go__body" src="images/product-1/go-5.png" alt="" style="--x:64.79%; --y:69.32%; --w:22.86%" />
                <img class="go__tick" src="images/product-1/tick-5.png" alt="" style="--x:79.46%; --y:56.27%; --w:14.91%" />
              </div>
            </div>

            <!-- Los 3 puntitos del final (flotan) -->
            <img class="dot" src="images/product-1/dot-1.png" alt="" style="--i:0; --x:79.95%; --y:86.29%; --w:9.9%" />
            <img class="dot" src="images/product-1/dot-2.png" alt="" style="--i:1; --x:87.53%; --y:89.95%; --w:8.19%" />
            <img class="dot" src="images/product-1/dot-3.png" alt="" style="--i:2; --x:92.91%; --y:91.91%; --w:7.09%" />
          </div>
        </div>
      </section>

      <!-- =====================================================
           DERECHA · Datos del producto sobre el fondo de rombos
           ===================================================== -->
      <section class="info" aria-labelledby="product-title">
        <div class="info__content">
          <h1 class="title" id="product-title">Dust Trousers</h1>
          <!-- TODO: aquí va el nombre en japonés (ahora es el texto de ejemplo de la maqueta) -->
          <p class="jp">nombre en japones</p>
          <!-- TODO: precio de ejemplo -->
          <p class="price">29,90 €</p>

          <form class="buy" id="buy-form" novalidate>
            <p class="buy__label" id="size-label">size</p>

            <!-- Las tallas son radios de verdad (se eligen con ratón o con las flechas del teclado);
                 el input va escondido y la estrella es su <label>. -->
            <div class="sizes" id="size-picker" role="radiogroup" aria-labelledby="size-label">
              <input class="sizes__input" type="radio" name="size" id="size-s" value="S" />
              <label class="sizes__star" for="size-s" style="--n:0; --r:-12deg">
                <img src="images/product-1/star.png" alt="" width="247" height="300" />
                <span>S</span>
              </label>

              <input class="sizes__input" type="radio" name="size" id="size-m" value="M" />
              <label class="sizes__star" for="size-m" style="--n:1; --r:7deg">
                <img src="images/product-1/star.png" alt="" width="247" height="300" />
                <span>M</span>
              </label>

              <input class="sizes__input" type="radio" name="size" id="size-l" value="L" />
              <label class="sizes__star" for="size-l" style="--n:2; --r:-4deg">
                <img src="images/product-1/star.png" alt="" width="247" height="300" />
                <span>L</span>
              </label>
            </div>

            <button class="purchase" type="submit"><span>Purchase</span></button>
            <p class="buy__message" id="buy-message" role="status" aria-live="polite"></p>
          </form>
        </div>

        <!-- Kira + Killer Queen (decorativo) -->
        <img class="kira" src="images/product-1/kira.png" alt="" width="586" height="652" />
      </section>
    </main>
  </body>
</html>
