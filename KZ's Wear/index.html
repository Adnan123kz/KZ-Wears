<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KZ Reservation</title>
    <link rel="icon" href="./images/icon.jpg" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="body">
    
    <header>
    </header>
    <main>
        <nav class="navbar">
          <ul>
            <li>
              <a href="#home">Home</a>
              <a href="#trend">Trend</a>
              <a href="#contact">Contact</a>
            </li>
        </nav>
        <div class="hero">
          <div class="rigth"></div>
          <div class="left"></div>
          <div class="title">
            <h1>KZ's Wear</h1>
            <p>Discover the latest fashion trends and styles.</p>
          </div>
        </div>

        <style>
          .body {
            margin: 0;
            padding: 0;
          }
          .navbar {
            background-image: url('./images/hero.jpg');
            overflow: hidden;
            
          }
          .navbar ul {
             list-style: none;
            display: flex;
            justify-content: flex-start;   /* antes: center */
            gap: 2.5rem;
            margin: 0;
            padding: 1rem 2rem;            /* espacio a la izquierda */
            background: rgba(10, 10, 15, 0.45);
            backdrop-filter: blur(4px);
          }
          .navbar a {
  position: relative;
  color: #269b08;
  text-decoration: none;
  text-transform: uppercase;
  font-style: italic;
  font-weight: 700;
  letter-spacing: 2px;
  font-size: 0.95rem;
  padding-bottom: 4px;
}

.navbar a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg, #ffb800, #ff2e92, #00c2a8);
  transition: width 0.35s ease;
}

.navbar a:hover::after {
  width: 100%;
}

.navbar a:hover {
  color: #ffb800;
  text-shadow: 0 0 8px rgba(255, 184, 0, 0.6);
}
          .hero {
            display: flex;
            height: 700px;
          }
          .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgb(54, 182, 8);
            text-align: center;
          }
          .rigth {
            background-image: url('./images/giorno.jpg');
            background-size: cover;
            background-position: center;
            height: 700px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
          }
          .left {
            background-image: url('./images/jolyne.jpg');
            background-size: cover;
            background-position: center;
            height: 700px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
          }


          .hero h1 {
            font-family: 'Cedarville Cursive', cursive;
            font-style: italic;
            font-size: 4rem;
            margin-bottom: 1rem;
            color: rgb(255, 145, 0);
            text-shadow: 0 0 10px rgba(0, 0, 0, 50);
          }
          .hero p {
            font-size: 1.25rem;
            color: rgb(253, 252, 252);
            text-shadow: 10px 10px 10px rgba(0, 0, 0, 50);
          }

          .title {
  animation: popIn 0.9s ease-out 0.3s both;
}

.hero h1 {
  opacity: 0;
  animation: fadeSlideUp 0.8s ease-out 0.6s forwards;
}

.hero p {
  opacity: 0;
  animation: fadeSlideUp 0.8s ease-out 0.9s forwards;
}



@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Oscurecer un poco las imágenes de fondo */
.rigth,
.left {
  position: relative;
}

.rigth::before,
.left::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.12);
  z-index: 1;
  pointer-events: none;
}
        </style>
    </main>
  </body>
</html>
